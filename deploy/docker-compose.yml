# ==========================================================================
# Atlas AI — deployable stack
#
#   cd deploy
#   docker compose --env-file ../.env up --build
#
# Then open http://localhost:8080
#
# Everything is served from ONE origin. nginx serves the built frontend and
# proxies /api to the backend, so the browser makes no cross-origin request:
# no CORS, and the refresh cookie is first-party rather than one that needs
# SameSite=None to survive.
#
# Day-to-day development still runs natively (see the root README). This file
# exists to make a complete, reproducible deployment, not to replace the dev
# loop.
# ==========================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The backend's `depends_on: service_healthy` waits on this. Without it
      # the backend starts while Postgres is still initialising, fails its
      # first connection, and restart-loops until it happens to win the race.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host. Nothing outside the compose network needs the
    # database, and publishing it would expose it on every interface.

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
      target: production
    container_name: atlas-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Inside the network the database answers to its service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # No CORS entries: nginx puts the API on the same origin as the app, so
      # there is no cross-origin request to allow.
      CORS_ORIGINS: ""
    volumes:
      # Uploaded files and the vector index. A named volume, because without
      # one every `docker compose up` would start with an empty knowledge base
      # while Postgres still held the document rows — the two stores would
      # disagree about what exists.
      - backend_storage:/app/storage
    # --proxy-headers so the client IP comes from X-Forwarded-For rather than
    # the nginx container's address; per-IP login rate limiting would
    # otherwise put every user in one bucket. Safe here precisely because the
    # backend is unpublished: nginx is the only thing that can reach it.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=1
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 for the same reason as the frontend check below. curl
      # happens to fall back to IPv4 where wget does not, but relying on
      # that is relying on a client detail rather than stating the intent.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: the first start runs migrations before it serves anything.
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
      target: production
      args:
        # "/" means same-origin. See the frontend Dockerfile for why this is a
        # build argument and cannot be set at run time.
        VITE_API_BASE_URL: "/"
    container_name: atlas-frontend
    restart: unless-stopped
    ports:
      - "${ATLAS_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, never "localhost". The container's /etc/hosts maps
      # localhost to ::1 as well as 127.0.0.1, busybox wget tries the IPv6
      # address first, and nginx's `listen 80` binds IPv4 only — so the check
      # got "connection refused" from a container that was serving perfectly.
      # Observed in deployment: the site returned 200 from the host while the
      # container sat marked unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_storage:
