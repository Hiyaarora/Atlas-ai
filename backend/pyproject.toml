[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-backend"
version = "0.1.0"
description = "Atlas AI - AI Knowledge Intelligence Platform (backend)"
requires-python = ">=3.12"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # --- Configuration ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",     # async driver, used by the application
    "psycopg[binary]>=3.2.0",  # sync driver, used by Alembic
    "alembic>=1.14.0",
    # --- Security ---
    "bcrypt>=4.2.0",       # password hashing
    "pyjwt>=2.10.0",       # access-token signing and verification
    "email-validator>=2.2.0",  # backs Pydantic's EmailStr
    # --- LLM providers ---
    "google-genai>=1.0.0",
    # --- Knowledge pipeline ---
    "pymupdf>=1.24.0",          # PDF text extraction
    "python-docx>=1.1.0",       # .docx
    "python-pptx>=1.0.0",       # .pptx
    "openpyxl>=3.1.0",          # .xlsx / .xlsm
    "beautifulsoup4>=4.12.0",   # .html
    "lxml>=5.0.0",              # HTML parser backend, recovers from malformed markup
    "chromadb>=0.5.0",          # vector index
    "python-multipart>=0.0.9",  # multipart/form-data uploads
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",       # async test client for FastAPI
    "black>=24.10.0",
    "ruff>=0.7.0",
    "isort>=5.13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ==========================================================================
# Tooling
# ==========================================================================

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"          # makes isort's output agree with black's
line_length = 100
known_first_party = ["app", "tests"]
# The local `alembic/` directory makes both isort and ruff guess that the
# installed `alembic` package is first-party. Without this they disagree and
# fight over import order forever.
known_third_party = ["alembic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear (likely bugs)
    "C4",  # comprehension simplifications
    "UP",  # pyupgrade (modern syntax)
    "ASYNC", # async-specific pitfalls
]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"       # no @pytest.mark.asyncio needed on every test
addopts = "-ra --strict-markers"
