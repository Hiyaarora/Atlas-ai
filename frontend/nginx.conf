# Serves the built SPA and fronts the API on one origin.

upstream atlas_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames change whenever content changes, so they can be cached
    # indefinitely. index.html must NOT be, or a browser keeps loading an old
    # document that references assets the new deploy has already removed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # nginx defaults this to 1 MB, well below the 20 MB the application
        # accepts. Left alone, every upload between those two sizes dies here
        # with a bare nginx 413 and no error envelope — the user sees a raw
        # server page instead of "File is larger than the 20 MB limit".
        #
        # Set slightly ABOVE the application limit on purpose, so the app is
        # the thing that rejects an oversized file and can say so properly.
        client_max_body_size 25m;

        proxy_pass http://atlas_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The backend reads the client address for per-IP rate limiting. Behind
        # this proxy every request would otherwise appear to come from the
        # nginx container, collapsing every user into one bucket.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies stream over Server-Sent Events. Buffering would hold
        # tokens until the response completed, turning a streaming answer into
        # a long pause followed by a wall of text.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Client-side routing: /login and /c/<id> are React Router paths with no
    # file behind them, so unmatched requests fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
